global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/rules/server_alerts.yml

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          service: "prometheus"

  # Replace/add Linux server addresses here.
  - job_name: "linux-servers"
    static_configs:
      - targets: ["host.docker.internal:9100"]
        labels:
          environment: "local"
          role: "linux-server"

  # Example:
  # - job_name: "production-linux"
  #   static_configs:
  #     - targets:
  #         - "10.0.0.21:9100"
  #         - "10.0.0.22:9100"
  #       labels:
  #         environment: "production"
