global:
  resolve_timeout: 5m
  smtp_smarthost: '${SMTP_SMARTHOST}'
  smtp_from: '${SMTP_FROM}'
  smtp_auth_username: '${SMTP_AUTH_USERNAME}'
  smtp_auth_password: '${SMTP_AUTH_PASSWORD}'

route:
  group_by: ['alertname', 'instance', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: default
  routes:
    - matchers: ['severity="emergency"']
      receiver: emergency
      repeat_interval: 30m

receivers:
  - name: default
    email_configs:
      - to: '${ALERT_EMAIL_TO}'
        send_resolved: true
    # Add webhook_configs here for Slack/Teams/Discord/PagerDuty gateways.

  - name: emergency
    email_configs:
      - to: '${ALERT_EMAIL_TO}'
        send_resolved: true
