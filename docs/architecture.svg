<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
<rect width="1200" height="720" fill="#071018"/>
<style>text{font-family:Arial,sans-serif;fill:#eaf2f8}.box{fill:#0e1a26;stroke:#2c5266;stroke-width:2}.title{font-size:24px;font-weight:700}.label{font-size:16px;font-weight:600}.small{font-size:12px;fill:#8ea5b7}.line{stroke:#5bd6ff;stroke-width:2;fill:none;marker-end:url(#a)}</style>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8Z" fill="#5bd6ff"/></marker></defs>
<text x="50" y="45" class="title">Data Center Infrastructure Monitoring &amp; Observability Platform</text>
<rect x="55" y="100" width="210" height="110" rx="12" class="box"/><text x="80" y="140" class="label">Linux Servers</text><text x="80" y="165" class="small">CPU • RAM • Disk</text><text x="80" y="185" class="small">Network • Sensors</text>
<rect x="335" y="100" width="210" height="110" rx="12" class="box"/><text x="385" y="140" class="label">Node Exporter</text><text x="385" y="165" class="small">Prometheus metrics</text><text x="385" y="185" class="small">:9100</text>
<rect x="615" y="100" width="210" height="110" rx="12" class="box"/><text x="680" y="140" class="label">Prometheus</text><text x="670" y="165" class="small">TSDB + PromQL</text><text x="670" y="185" class="small">Alert rules</text>
<rect x="895" y="100" width="210" height="110" rx="12" class="box"/><text x="940" y="140" class="label">Alertmanager</text><text x="945" y="165" class="small">Grouping + routing</text><text x="945" y="185" class="small">Email / Webhook</text>
<path d="M265 155 H335" class="line"/><path d="M545 155 H615" class="line"/><path d="M825 155 H895" class="line"/>
<rect x="120" y="340" width="230" height="120" rx="12" class="box"/><text x="175" y="380" class="label">React UI</text><text x="175" y="405" class="small">Operations Center</text><text x="175" y="425" class="small">RBAC-aware dashboards</text>
<rect x="485" y="340" width="230" height="120" rx="12" class="box"/><text x="550" y="380" class="label">FastAPI</text><text x="540" y="405" class="small">JWT • RBAC • REST</text><text x="540" y="425" class="small">Diagnostics • Audit</text>
<rect x="850" y="340" width="230" height="120" rx="12" class="box"/><text x="900" y="380" class="label">PostgreSQL</text><text x="900" y="405" class="small">Users • Audit</text><text x="900" y="425" class="small">Maintenance metadata</text>
<path d="M350 400 H485" class="line"/><path d="M715 400 H850" class="line"/><path d="M600 340 V210" class="line"/>
<rect x="305" y="560" width="590" height="90" rx="12" class="box"/><text x="465" y="600" class="label">Grafana + Experimental Anomaly Lab</text><text x="405" y="625" class="small">Historical visualization + separate Python anomaly analysis</text>
<path d="M720 340 V280 H600 V210" class="line"/><path d="M720 460 V560" class="line"/>
</svg>